name: sonar

on:
  push:
    branches: [main]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SONAR_ENABLED: ${{ secrets.SONAR_HOST_URL != '' && secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: env.SONAR_ENABLED == 'true'
        with:
          fetch-depth: 0
      - name: Python einrichten
        if: env.SONAR_ENABLED == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        if: env.SONAR_ENABLED == 'true'
        run: pip install pytest pytest-cov fastapi httpx python-multipart
      - name: Tests mit Coverage (erzeugt coverage.xml fuer Sonar)
        if: env.SONAR_ENABLED == 'true'
        run: python -m pytest -q tests --cov=. --cov-report=xml
      - name: SonarQube-Analyse (No-Op ohne Sonar-Secrets)
        if: env.SONAR_ENABLED == 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
